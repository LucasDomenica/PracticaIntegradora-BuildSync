<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/estilos.css">
  <title>albañil</title>
</head>

<body>
  <button id="logout-btn" class="logout-btn" type="button">Cerrar Sesión</button>
  <!-- Panel de Albañil -->
  <section id="albañil-panel">
    <h2>Panel de Albañil</h2>
    <!-- Marcar asistencia -->
    <form id="attendance-check-in">
      <button type="submit">Marcar Asistencia</button>
    </form>

    <!-- Mostrar asistencia -->
    <h3>Historial de Asistencia</h3>
    <ul id="attendance-history">
      <!-- Días y horas trabajadas aparecerán aquí -->
    </ul>
  </section>
  <script src="/js/albañil.js"></script>
  <script src="/js/logout.js"></script>
</body>
